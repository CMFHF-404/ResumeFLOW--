map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # Yifut calls this public URL directly. Unlike browser API requests, this
    # path does not contain the extra /api prefix added by apiClient, so keep
    # the backend route intact instead of applying the general prefix strip.
    location = /api/billing/payments/yifut/notify {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
        proxy_pass http://${BACKEND_UPSTREAM}/api/billing/payments/yifut/notify;
    }

    location = /api {
        return 308 /api/;
    }

    # Match the Vite development proxy: /api is a frontend-only transport
    # prefix and exactly one copy is removed before forwarding to FastAPI.
    location ^~ /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
        proxy_pass http://${BACKEND_UPSTREAM}/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
